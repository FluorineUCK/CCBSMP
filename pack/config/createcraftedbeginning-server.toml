#.
#Optical Power
[optical_power]

	#.
	#.
	#Chunk Stabilizer
	[optical_power.chunk_stabilizer]
		#.
		#.
		#Allow Chunk Stabilizers to keep their own current chunk ticking without power or nearby players, including Create contraptions, trains and Sable structures. Sable also retains its native physics loading around the structure. Disabling releases stabilizer tickets, including their Sable structure tickets. After re-enabling, trains resume automatically; other unloaded devices or structures resume when loaded again.
		enable_chunk_loading = true

	#.
	#Optical Power Network
	[optical_power.network]
		#.
		#.
		#[Unit: lm]
		#Maximum luminous flux distributed simultaneously by one optical fiber network.
		# Default: 512.0
		# Range: 1.0 ~ 65536.0
		max_network_flux_lm = 512.0
		#.
		#[Unit: lm]
		#Maximum luminous flux allocated to each consumer in an optical fiber network. Actual allocation also depends on source output and the network limit.
		# Default: 48.0
		# Range: 1.0 ~ 512.0
		max_consumer_flux_lm = 48.0

	#.
	#Amethyst Collector Panel
	[optical_power.amethyst_collector_panel]
		#.
		#.
		#[Unit: multiplier relative to standard behavior; 1 = standard]
		#Scales the standard rainy-weather output of 50% of clear-weather output. A value of 0 disables output in rain; 1 preserves the standard reduction; 2 restores clear-weather output.
		# Default: 1.0
		# Range: 0.0 ~ 2.0
		rain_output_multiplier = 1.0

	#.
	#Photothermal Chamber
	[optical_power.photothermal_chamber]
		#.
		#.
		#[Unit: lm]
		#Maximum combined luminous flux admitted to one photothermal chamber inventory. Heating targets depend on local surface illuminance and coverage, not summed input flux.
		# Default: 48.0
		# Range: 1.0 ~ 512.0
		max_received_flux_lm = 48.0
