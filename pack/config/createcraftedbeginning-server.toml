	#Cardboard Crate
	[storage.cardboard_crate]
		#.
		#.
		#[Unit: items]
		#Maximum number of individual items stored in one Cardboard Crate. This is an item count, not a count of item stacks.
		# Default: 64
		# Range: 1 ~ 64
